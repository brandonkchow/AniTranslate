name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.1). Leave empty to auto-generate from run number.'
        required: false
        default: ''
      release_title:
        description: 'Release Title (e.g. AniTranslate v1.0.1). Leave empty for default.'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment Files
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi
          if [ ! -f ".env.example" ]; then
            touch .env.example
          fi

      - name: Prepare Debug & Release Keystores
        id: setup-keystore
        run: |
          # Ensure root debug.keystore exists for debugConfig in build.gradle.kts
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/debug.keystore"
            echo "Decoded debug.keystore from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

          # Setup custom release keystore if secrets are configured
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No custom release keystore secret provided, building assembleDebug APK."
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK
        run: |
          if [ "${{ steps.setup-keystore.outputs.has_release_keystore }}" = "true" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: locate-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-apk
          path: ${{ steps.locate-apk.outputs.apk_path }}

      - name: Determine Version Tag & Title
        id: release-info
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            TAG="${{ inputs.version_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          else
            TITLE="Release $TAG"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate-apk.outputs.apk_path }}
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: ${{ steps.release-info.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
