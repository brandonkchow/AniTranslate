name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.0, etc.
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Environment Files
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Setup Keystore & Environment Secrets (Optional)
        id: setup-keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No custom release keystore secret provided, building assembleDebug APK."
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK
        run: |
          if [ "${{ steps.setup-keystore.outputs.has_release_keystore }}" = "true" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: locate-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-apk
          path: ${{ steps.locate-apk.outputs.apk_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate-apk.outputs.apk_path }}
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
